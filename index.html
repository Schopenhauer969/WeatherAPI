<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="weather-container">
      <h1>Weather Finder</h1>

      <div class="search-box">
        <input
          type="text"
          id="city-input"
          placeholder="Enter city name..."
          autocomplete="off"
        />
        <button id="search-btn">Search</button>
      </div>

      <div id="error" class="error-msg">City not found. Please try again.</div>

      <div id="weather-card" class="weather-info">
        <div id="city-display" class="city-name">--</div>
        <div id="temp-display" class="temp">--°C</div>
        <div id="condition-display" class="condition">--</div>

        <div class="details">
          <div class="detail-item">
            Humidity
            <span id="humidity-display">--%</span>
          </div>
          <div class="detail-item">
            Wind Speed
            <span id="wind-display">-- m/s</span>
          </div>
        </div>
      </div>
    </div>

    <script src="weather.js"></script>
  </body>
</html>
